swagger: "2.0"
info:
  description: "API for fetching movie data from TMDB API."
  version: "1.0.0"
  title: "Movies API"

securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    in: header
    name: API-Key

security:
  - ApiKeyAuth: []

paths:
  /movies:
    get:
      tags:
        - Movies
      summary: "Get a list of random movies"
      parameters:
        - name: n
          in: query
          type: integer
          required: true
          description: "Number of random movies to list (1-20)"
          minimum: 1
          maximum: 20
      responses:
        200:
          description: "A list of random movies"
          schema:
            type: array
            items:
              $ref: "#/definitions/Movie"
        400:
          description: "Invalid parameter value"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized - Invalid or missing API key"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal server error when fetching movies"
          schema:
            $ref: "#/definitions/Error"

  /movies/popular:
    get:
      tags:
        - Movies
      summary: "Get a list of popular movies"
      parameters:
        - name: n
          in: query
          type: integer
          required: true
          description: "Number of popular movies to list (1-20)"
          minimum: 1
          maximum: 20
      responses:
        200:
          description: "A list of popular movies"
          schema:
            type: array
            items:
              $ref: "#/definitions/Movie"
        400:
          description: "Invalid parameter value"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized - Invalid or missing API key"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "No popular movies found"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal server error"
          schema:
            $ref: "#/definitions/Error"

  /movies/{movie_id}/similar-genres:
    get:
      tags:
        - Movies
      summary: "Get movies with similar genres to a specific movie"
      parameters:
        - name: movie_id
          in: path
          type: integer
          required: true
          description: "The movie ID to search for similar genres"
      responses:
        200:
          description: "A list of movies with similar genres"
          schema:
            type: array
            items:
              $ref: "#/definitions/Movie"
        400:
          description: "Invalid movie ID or no genres found"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized - Invalid or missing API key"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Movie not found"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal server error"
          schema:
            $ref: "#/definitions/Error"

  /movies/{movie_id}/similar-runtime:
    get:
      tags:
        - Movies
      summary: "Get movies with similar runtime to a specific movie"
      parameters:
        - name: movie_id
          in: path
          type: integer
          required: true
          description: "The movie ID to search for similar runtime"
      responses:
        200:
          description: "A list of movies with similar runtime"
          schema:
            type: array
            items:
              $ref: "#/definitions/Movie"
        400:
          description: "Invalid movie ID or runtime not found"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized - Invalid or missing API key"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Movie not found"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal server error"
          schema:
            $ref: "#/definitions/Error"

  /movies/compare:
    post:
      tags:
        - Movies
      summary: "Generate a comparison chart for movies based on their scores"
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              movie_ids:
                type: array
                items:
                  type: integer
      responses:
        200:
          description: "URL of the generated chart"
          schema:
            type: object
            properties:
              chart_url:
                type: string
        400:
          description: "Invalid request or no movie IDs provided"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized - Invalid or missing API key"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "One or more movies not found"
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
              not_found_ids:
                type: array
                items:
                  type: integer
        500:
          description: "Internal server error"
          schema:
            $ref: "#/definitions/Error"

  /movies/favorites/{movie_id}:
    post:
      tags:
        - Movies
      summary: "Add a movie to favorites"
      parameters:
        - name: movie_id
          in: path
          type: integer
          required: true
          description: "The movie ID to add to favorites"
      responses:
        200:
          description: "Movie added to favorites"
          schema:
            type: object
            properties:
              message:
                type: string
              favorites:
                type: array
                items:
                  $ref: "#/definitions/Movie"
        400:
          description: "Movie already in favorites"
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
              favorites:
                type: array
                items:
                  $ref: "#/definitions/Movie"
        401:
          description: "Unauthorized - Invalid or missing API key"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Movie not found"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal server error"
          schema:
            $ref: "#/definitions/Error"

    delete:
      tags:
        - Movies
      summary: "Remove a movie from favorites"
      parameters:
        - name: movie_id
          in: path
          type: integer
          required: true
          description: "The movie ID to remove from favorites"
      responses:
        200:
          description: "Movie removed from favorites"
          schema:
            type: object
            properties:
              message:
                type: string
              favorites:
                type: array
                items:
                  $ref: "#/definitions/Movie"
        401:
          description: "Unauthorized - Invalid or missing API key"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Movie not found in favorites"
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
              favorites:
                type: array
                items:
                  $ref: "#/definitions/Movie"
        500:
          description: "Internal server error"
          schema:
            $ref: "#/definitions/Error"

  /movies/favorites:
    get:
      tags:
        - Movies
      summary: "Get a list of all favorite movies"
      responses:
        200:
          description: "List of favorite movies"
          schema:
            type: array
            items:
              $ref: "#/definitions/Movie"
        401:
          description: "Unauthorized - Invalid or missing API key"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "No favorites found"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal server error"
          schema:
            $ref: "#/definitions/Error"

definitions:
  Movie:
    type: object
    properties:
      id:
        type: integer
      title:
        type: string
      overview:
        type: string
      poster_path:
        type: string
      backdrop_path:
        type: string
      vote_average:
        type: number
      vote_count:
        type: integer
      release_date:
        type: string
      runtime:
        type: integer
      genres:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
      genre_ids:
        type: array
        items:
          type: integer

  Error:
    type: object
    properties:
      error:
        type: string
      message:
        type: string